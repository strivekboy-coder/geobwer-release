[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tailgap"
version = "0.6.3"
description = "Support-aware geospatial deployment-tail risk auditing and paper reproduction."
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "Weilun Zhong"}]
dependencies = [
  "numpy>=1.24,<2.1", "matplotlib>=3.7,<4", "PyYAML>=6,<7",
  "scikit-learn>=1.3,<1.8", "scipy>=1.10,<1.16", "pandas>=2.1,<2.3",
]

[project.optional-dependencies]
test = ["pytest>=8,<9", "lmdb>=1.4,<2", "safetensors>=0.4,<0.6", "rasterio>=1.3,<1.5", "h5py>=3.10,<4", "huggingface-hub>=0.23,<1", "tifffile>=2024,<2026"]
models = ["torch>=2.5,<3", "torchvision>=0.20,<1", "timm==1.0.15", "einops>=0.6", "huggingface-hub>=0.23", "kornia>=0.7"]
geo = ["rasterio>=1.3,<1.5", "earthengine-api>=1.4", "pyarrow>=17", "geopandas>=1", "shapely>=2"]

[project.scripts]
tailgap = "tailgap.cli:main"
rsfm-audit = "rsfm_fairness_audit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-p no:cacheprovider"
